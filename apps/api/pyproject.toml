[project]
name = "geetest-service-platform-api"
version = "0.1.0"
description = "FastAPI backend for the GeeTest Service Platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5,<2.0.0",
  "argon2-cffi>=25.1.0,<26.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "fastapi>=0.116.1,<0.117.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.41,<3.0.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29.0",
  "mypy>=1.18.1,<2.0.0",
  "pytest>=8.4.1,<9.0.0",
  "ruff>=0.12.12,<0.13.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "tests", "pyproject.toml"]
